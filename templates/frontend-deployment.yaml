apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zimmporter.fullname" . }}-frontend
  labels:
    {{- include "zimmporter.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "zimmporter.frontendSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zimmporter.frontendSelectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.frontend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.images.frontend.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.images.frontend.repository }}:{{ .Values.images.frontend.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default .Values.images.frontend.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 51010
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "zimmporter.fullname" . }}-frontend-config
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.authSecretName" . }}
                  key: {{ .Values.auth.existingSecretKey }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.authSecretName" . }}
                  key: oidc-client-secret
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.authSecretName" . }}
                  key: github-client-secret
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.authSecretName" . }}
                  key: auth-secret
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
