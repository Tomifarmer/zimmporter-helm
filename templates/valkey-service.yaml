{{- if not .Values.valkey.external.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zimmporter.fullname" . }}-valkey
  labels:
    {{- include "zimmporter.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    {{- include "zimmporter.valkeySelectorLabels" . | nindent 4 }}
{{- end }}
