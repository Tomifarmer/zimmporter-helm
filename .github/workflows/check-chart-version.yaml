name: Check chart version matches tag

on:
  push:
    tags:
      - 'v*'

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check chart version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CHART_VERSION=$(grep '^version:' Chart.yaml | awk '{print $2}')
          if [ "$TAG" != "$CHART_VERSION" ]; then
            echo "❌ Chart version ($CHART_VERSION) does not match tag ($TAG)"
            exit 1
          fi
          echo "✅ Chart version $CHART_VERSION matches tag $TAG"
