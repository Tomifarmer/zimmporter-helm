# ── Global ──────────────────────────────────────────────────────────
nameOverride: ""
fullnameOverride: ""
global:
  imagePullPolicy: ""
  extraEnv: []

# ── Image settings ──────────────────────────────────────────────────
images:
  api:
    repository: ghcr.io/tomifarmer/zimmporter-api
    tag: "latest"
    pullPolicy: IfNotPresent
    pullSecret: ""
  worker:
    repository: ghcr.io/tomifarmer/zimmporter-worker
    tag: "latest"
    pullPolicy: IfNotPresent
    pullSecret: ""
  frontend:
    repository: ghcr.io/tomifarmer/zimmporter-front
    tag: "latest"
    pullPolicy: IfNotPresent
    pullSecret: ""

# ── Ingress ─────────────────────────────────────────────────────────
ingress:
  api:
    enabled: false
    host: api.example.com
    className: ""
    annotations: {}
    tls: []
      # - hosts:
      #     - api.example.com
      #   secretName: api-tls
  frontend:
    enabled: false
    host: app.example.com
    className: ""
    annotations: {}
    tls: []
      # - hosts:
      #     - app.example.com
      #   secretName: frontend-tls

# ── API (FastAPI) ───────────────────────────────────────────────────
api:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podSecurityContext:
    fsGroup: 51000
  nodeSelector: {}
  tolerations: []
  affinity: {}
  initImage: busybox:1.36
  initSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
    readOnlyRootFilesystem: true
  probes:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 5
    readiness:
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
  env:
    USE_SIMPLE_AUTH: "false"
    USE_SOCIAL_LOGIN: "false"
    CORS_ALLOWED_ORIGINS: "*"
    OIDC_ISSUER_URL: ""
    API_PROXY_FETCH: "false"
  # Which library sources feed the `available_albums` index:
  # "s3" (default), "navidrome", or "both".
  indexSource: s3
  # How often (minutes) the API pod dispatches the library index task.
  indexIntervalMinutes: 30
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

# ── Celery Worker ───────────────────────────────────────────────────
worker:
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi
  podSecurityContext:
    fsGroup: 51000
  nodeSelector: {}
  tolerations: []
  affinity: {}
  initImage: busybox:1.36
  initSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
    readOnlyRootFilesystem: true
  concurrency: 4
  pool: prefork
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

# ── Frontend (Next.js) ──────────────────────────────────────────────
frontend:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podSecurityContext:
    runAsNonRoot: true
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  env:
    # Set to full URL with scheme (e.g. "https://api.example.com")
    # when using TLS ingress. Without a scheme the frontend treats
    # the value as a relative path and constructs the wrong URL.
    API_URL: ""
    USE_SOCIAL_LOGIN: "false"
    USE_SIMPLE_AUTH: "false"
    OIDC_NAME: "OIDC"
    OIDC_ISSUER_URL: ""

# ── External S3-compatible storage ──────────────────────────────────
s3:
  endpoint: ""
  accessKey: ""
  secretKey: ""
  bucket: ""
  useSSL: false
  existingSecret: ""
  existingSecretKeyMapping:
    accessKey: access-key
    secretKey: secret-key

# ── Navidrome (optional library index source) ───────────────────────
# When `api.indexSource` is "navidrome" or "both", the worker queries
# Navidrome's Subsonic API to populate the available-albums index.
navidrome:
  url: ""
  user: ""
  password: ""
  # Reference an existing Secret instead of generating one.
  existingSecret: ""
  existingSecretKeyMapping:
    user: user
    password: password

# ── MariaDB ─────────────────────────────────────────────────────────
mariadb:
  image: mariadb:11
  external:
    enabled: false
    host: ""
    port: 3306
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 999
  storageClass: ""
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── Valkey ──────────────────────────────────────────────────────────
valkey:
  image: valkey/valkey:latest
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 999
  external:
    enabled: false
    address: ""
    port: 6379
  storageClass: ""
  persistence:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── Celery broker/backend (overrides auto-derived defaults) ─────────
celery:
  broker: ""
  backend: ""

# ── BgUtils POT provider (yt-dlp PO tokens) ─────────────────────────
potProvider:
  enabled: true
  image:
    repository: brainicism/bgutil-ytdlp-pot-provider
    tag: "1.3.1"
    pullPolicy: IfNotPresent
  replicas: 1
  port: 4416
  podSecurityContext:
    runAsNonRoot: true
  probes:
    enabled: true
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 15
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# ── YouTube cookies (shared volume between API and worker) ──────────
# The API writes the uploaded cookies file here; the worker mounts the
# same volume read-only via YTDLP_COOKIEFILE.
cookies:
  # Directory the API writes cookies into (mounted from the shared volume).
  dir: /var/zimmporter/cookies
  # Worker-side mount path (same volume, mounted read-only).
  workerMountPath: /etc/zimmporter/cookies
  # Cookie file name inside the shared volume.
  filename: cookies.txt
  # Shared-volume backend. Priority: hostPath (when set) > PVC
  # (persistence.enabled) > emptyDir (per-pod, not shared).
  #
  # hostPath is intended for single-node clusters that lack an RWX
  # StorageClass (e.g. k3s local-path). The API and worker pods run on
  # the same node, so they share this directory. Leave empty to use the
  # PVC backend.
  hostPath: ""
  persistence:
    enabled: true
    # StorageClass for the cookies PVC (default cluster StorageClass when empty).
    # Requires ReadWriteMany (or a storage class that allows shared access)
    # because both the API and worker pods mount the same volume.
    storageClass: ""
    accessModes:
      - ReadWriteMany
    size: 1Gi

# ── Database credentials ────────────────────────────────────────────
database:
  host: ""
  port: ""
  rootPassword: ""
  user: zimmporter
  password: ""
  name: zimmporter
  # Reference an existing Secret instead of generating one.
  # The secret must contain keys matching existingSecretKeyMapping below.
  existingSecret: ""
  existingSecretKeyMapping:
    rootPassword: root-password
    user: user
    password: password
    name: name

# ── Authentication ──────────────────────────────────────────────────
auth:
  apiKey: ""
  oidcClientId: ""
  oidcClientSecret: ""
  githubClientId: ""
  githubClientSecret: ""
  # NextAuth encryption key — signs JWTs and encrypts session cookies.
  # Generate one with: openssl rand -base64 32
  authSecret: "dev-secret-change-in-production"
  # Dedicated secret ref for API_KEY.
  apiKeyExistingSecret: ""
  apiKeyExistingSecretKey: api-key
  # OIDC-specific secret for client ID and client secret.
  oidc:
    existingSecret: ""
    existingSecretKeyMapping:
      clientId: client-id
      clientSecret: client-secret
  # GitHub-specific secret for client ID and client secret.
  github:
    existingSecret: ""
    existingSecretKeyMapping:
      clientId: github-client-id
      clientSecret: github-client-secret

# ── Private CA certificate ──────────────────────────────────────────
# Mounts a CA cert file into the API/worker pods so HTTPS clients trust
# a private CA. A CA bundle is public data, so a ConfigMap is sufficient.
# Requires `existingConfigMap` (must contain key `ca.crt` by default, see
# `key`); the file is mounted read-only at `path`.
caCert:
  enabled: false
  path: /etc/ssl/certs/ca.crt
  existingConfigMap: ""
  key: ca.crt
