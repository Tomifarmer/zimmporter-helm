{{- if not .Values.mariadb.external.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zimmporter.fullname" . }}-mariadb
  labels:
    {{- include "zimmporter.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: mysql
      protocol: TCP
      name: mysql
  selector:
    {{- include "zimmporter.mariadbSelectorLabels" . | nindent 4 }}
{{- end }}
