apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zimmporter.fullname" . }}-api-config
  labels:
    {{- include "zimmporter.labels" . | nindent 4 }}
data:
  DB_HOST: {{ include "zimmporter.dbHost" . | quote }}
  DB_PORT: {{ include "zimmporter.dbPort" . | quote }}
  CELERY_BROKER: {{ include "zimmporter.celeryBroker" . | quote }}
  CELERY_BACKEND: {{ include "zimmporter.celeryBackend" . | quote }}
  USE_SIMPLE_AUTH: {{ .Values.api.env.USE_SIMPLE_AUTH | quote }}
  USE_SOCIAL_LOGIN: {{ .Values.api.env.USE_SOCIAL_LOGIN | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.api.env.CORS_ALLOWED_ORIGINS | quote }}
  OIDC_ISSUER_URL: {{ .Values.api.env.OIDC_ISSUER_URL | quote }}
  OIDC_CLIENT_ID: {{ .Values.api.env.OIDC_CLIENT_ID | quote }}
  GITHUB_CLIENT_ID: {{ .Values.api.env.GITHUB_CLIENT_ID | quote }}
  API_PROXY_FETCH: {{ .Values.api.env.API_PROXY_FETCH | quote }}
  COOKIE_DIR: {{ .Values.cookies.dir | quote }}
{{- if .Values.caCert.enabled }}
  CA_CERT: {{ .Values.caCert.path | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zimmporter.fullname" . }}-worker-config
  labels:
    {{- include "zimmporter.labels" . | nindent 4 }}
data:
  DB_HOST: {{ include "zimmporter.dbHost" . | quote }}
  DB_PORT: {{ include "zimmporter.dbPort" . | quote }}
  CELERY_BROKER: {{ include "zimmporter.celeryBroker" . | quote }}
  CELERY_BACKEND: {{ include "zimmporter.celeryBackend" . | quote }}
  AWS_ENDPOINT_URL: {{ .Values.s3.endpoint | quote }}
  AWS_USE_SSL: {{ .Values.s3.useSSL | toString | quote }}
  AWS_BUCKET: {{ .Values.s3.bucket | quote }}
  YTDLP_COOKIEFILE: {{ printf "%s/%s" .Values.cookies.workerMountPath .Values.cookies.filename | quote }}
  {{- if .Values.potProvider.enabled }}
  POT_PROVIDER_URL: {{ include "zimmporter.potProviderUrl" . | quote }}
  {{- end }}
{{- if .Values.caCert.enabled }}
  CA_CERT: {{ .Values.caCert.path | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zimmporter.fullname" . }}-frontend-config
  labels:
    {{- include "zimmporter.labels" . | nindent 4 }}
data:
  API_URL: {{ .Values.frontend.env.API_URL | default (include "zimmporter.apiInternalUrl" .) | quote }}
  USE_SOCIAL_LOGIN: {{ .Values.frontend.env.USE_SOCIAL_LOGIN | quote }}
  USE_SIMPLE_AUTH: {{ .Values.frontend.env.USE_SIMPLE_AUTH | quote }}
  OIDC_NAME: {{ .Values.frontend.env.OIDC_NAME | quote }}
  OIDC_ISSUER_URL: {{ .Values.frontend.env.OIDC_ISSUER_URL | quote }}
  GITHUB_CLIENT_ID: {{ .Values.frontend.env.GITHUB_CLIENT_ID | quote }}
