apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zimmporter.fullname" . }}-worker
  labels:
    {{- include "zimmporter.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "zimmporter.workerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zimmporter.workerSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.worker.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.images.worker.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.images.worker.repository }}:{{ .Values.images.worker.tag }}"
          imagePullPolicy: {{ .Values.images.worker.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 51000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          command:
            - celery
            - -A
            - tasks.celery_app
            - worker
            - --loglevel=info
            - --concurrency={{ .Values.worker.concurrency }}
            - --pool={{ .Values.worker.pool }}
          envFrom:
            - configMapRef:
                name: {{ include "zimmporter.fullname" . }}-worker-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKeyMapping.user }}
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKeyMapping.password }}
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKeyMapping.name }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.fullname" . }}-s3
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.fullname" . }}-s3
                  key: secret-key
            - name: AWS_BUCKET
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.fullname" . }}-s3
                  key: bucket
          {{- if .Values.caCert.enabled }}
            - name: CA_CERT
              value: {{ .Values.caCert.path | quote }}
          {{- end }}
          volumeMounts:
            - name: temp-data
              mountPath: /data/zimmer/importer
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - tasks.celery_app
                - inspect
                - ping
                - --timeout=5
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        - name: temp-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
