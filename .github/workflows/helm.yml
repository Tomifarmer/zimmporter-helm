name: Publish Helm Chart

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            VER="${TAG#v}"
            echo "version=${VER}" >> "$GITHUB_OUTPUT"
            echo "app_version=${VER}" >> "$GITHUB_OUTPUT"
          else
            VER=$(grep '^version:' Chart.yaml | awk '{print $2}')
            AV=$(grep '^appVersion:' Chart.yaml | awk '{print $2}' | tr -d '"')
            echo "version=${VER}" >> "$GITHUB_OUTPUT"
            echo "app_version=${AV}" >> "$GITHUB_OUTPUT"
          fi

      - name: Lowercase owner
        run: echo "OWNER_LOWER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Lint chart
        run: helm lint .

      - name: Template chart
        run: helm template . --debug

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push
        run: |
          helm package . \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.app_version }}"
          helm push zimmporter-*.tgz oci://ghcr.io/${{ env.OWNER_LOWER }}
