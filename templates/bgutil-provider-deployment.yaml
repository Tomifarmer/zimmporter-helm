{{- if .Values.potProvider.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zimmporter.fullname" . }}-bgutil-provider
  labels:
    {{- include "zimmporter.labels" . | nindent 4 }}
    app.kubernetes.io/component: bgutil-provider
spec:
  replicas: {{ .Values.potProvider.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "zimmporter.bgutilSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zimmporter.bgutilSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.potProvider.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bgutil-provider
          image: "{{ .Values.potProvider.image.repository }}:{{ .Values.potProvider.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default .Values.potProvider.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: {{ .Values.potProvider.port }}
              name: http
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- if or .Values.global.extraEnv .Values.potProvider.extraEnv }}
          env:
            {{- with .Values.global.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.potProvider.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if .Values.potProvider.probes.enabled }}
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.potProvider.port }}
            initialDelaySeconds: {{ .Values.potProvider.probes.liveness.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.potProvider.probes.liveness.periodSeconds | default 15 }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.potProvider.port }}
            initialDelaySeconds: {{ .Values.potProvider.probes.readiness.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.potProvider.probes.readiness.periodSeconds | default 10 }}
          {{- end }}
          resources:
            {{- toYaml .Values.potProvider.resources | nindent 12 }}
      {{- with .Values.potProvider.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.potProvider.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.potProvider.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
