apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zimmporter.fullname" . }}-api
  labels:
    {{- include "zimmporter.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "zimmporter.apiSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zimmporter.apiSelectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.api.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.images.api.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      {{- if or (not .Values.mariadb.external.enabled) (not .Values.valkey.external.enabled) }}
      initContainers:
        {{- if not .Values.mariadb.external.enabled }}
        - name: wait-for-mariadb
          image: {{ .Values.api.initImage }}
          securityContext:
            {{- toYaml .Values.api.initSecurityContext | nindent 12 }}
          command:
            - sh
            - -c
            - until nc -z {{ include "zimmporter.dbHost" . }} {{ include "zimmporter.dbPort" . }}; do sleep 2; done
        {{- end }}
        {{- if not .Values.valkey.external.enabled }}
        - name: wait-for-valkey
          image: {{ .Values.api.initImage }}
          securityContext:
            {{- toYaml .Values.api.initSecurityContext | nindent 12 }}
          command:
            - sh
            - -c
            - until nc -z {{ include "zimmporter.valkeyAddress" . }} {{ include "zimmporter.valkeyPort" . }}; do sleep 2; done
        {{- end }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default .Values.images.api.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 51000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "zimmporter.fullname" . }}-api-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKeyMapping.user }}
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKeyMapping.password }}
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKeyMapping.name }}
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.apiKeyExistingSecret | default (include "zimmporter.authSecretName" .) }}
                  key: {{ .Values.auth.apiKeyExistingSecretKey | default "api-key" }}
          {{- if or .Values.auth.oidc.existingSecret .Values.auth.oidcClientId }}
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.authOidcSecretName" . }}
                  key: {{ .Values.auth.oidc.existingSecretKeyMapping.clientId }}
          {{- end }}
          {{- if or .Values.auth.github.existingSecret .Values.auth.githubClientId }}
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.authGitHubSecretName" . }}
                  key: {{ .Values.auth.github.existingSecretKeyMapping.clientId }}
          {{- end }}
          {{- with .Values.global.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
          {{- if and .Values.caCert.enabled .Values.caCert.existingConfigMap }}
            - name: ca-cert
              mountPath: {{ .Values.caCert.path | quote }}
              subPath: {{ .Values.caCert.key }}
              readOnly: true
          {{- end }}
          {{- with .Values.api.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: {{ .Values.api.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.api.probes.liveness.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: {{ .Values.api.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.api.probes.readiness.timeoutSeconds }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- if and .Values.caCert.enabled .Values.caCert.existingConfigMap }}
        - name: ca-cert
          configMap:
            name: {{ .Values.caCert.existingConfigMap }}
            defaultMode: 0444
        {{- end }}
      {{- with .Values.api.extraVolumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
