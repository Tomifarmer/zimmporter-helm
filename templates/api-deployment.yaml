apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zimmporter.fullname" . }}-api
  labels:
    {{- include "zimmporter.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "zimmporter.apiSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zimmporter.apiSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.api.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.images.api.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "zimmporter.fullname" . }}-api-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKeyMapping.user }}
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKeyMapping.password }}
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKeyMapping.name }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.fullname" . }}-s3
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.fullname" . }}-s3
                  key: secret-key
            - name: AWS_BUCKET
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.fullname" . }}-s3
                  key: bucket
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.authSecretName" . }}
                  key: {{ .Values.auth.existingSecretKey }}
          {{- if .Values.caCert.enabled }}
            - name: CA_CERT
              value: {{ .Values.caCert.path | quote }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
