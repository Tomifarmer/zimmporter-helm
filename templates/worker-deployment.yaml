apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zimmporter.fullname" . }}-worker
  labels:
    {{- include "zimmporter.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "zimmporter.workerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zimmporter.workerSelectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.worker.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.images.worker.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      {{- if or (not .Values.mariadb.external.enabled) (not .Values.valkey.external.enabled) }}
      initContainers:
        {{- if not .Values.mariadb.external.enabled }}
        - name: wait-for-mariadb
          image: {{ .Values.worker.initImage }}
          securityContext:
            {{- toYaml .Values.worker.initSecurityContext | nindent 12 }}
          command:
            - sh
            - -c
            - until nc -z {{ include "zimmporter.dbHost" . }} {{ include "zimmporter.dbPort" . }}; do sleep 2; done
        {{- end }}
        {{- if not .Values.valkey.external.enabled }}
        - name: wait-for-valkey
          image: {{ .Values.worker.initImage }}
          securityContext:
            {{- toYaml .Values.worker.initSecurityContext | nindent 12 }}
          command:
            - sh
            - -c
            - until nc -z {{ include "zimmporter.valkeyAddress" . }} {{ include "zimmporter.valkeyPort" . }}; do sleep 2; done
        {{- end }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.images.worker.repository }}:{{ .Values.images.worker.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default .Values.images.worker.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 51000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          command:
            - celery
            - -A
            - tasks.celery_app
            - worker
            - --loglevel=info
            - --concurrency={{ .Values.worker.concurrency }}
            - --pool={{ .Values.worker.pool }}
          envFrom:
            - configMapRef:
                name: {{ include "zimmporter.fullname" . }}-worker-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKeyMapping.user }}
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKeyMapping.password }}
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKeyMapping.name }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.s3SecretName" . }}
                  key: {{ .Values.s3.existingSecretKeyMapping.accessKey }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.s3SecretName" . }}
                  key: {{ .Values.s3.existingSecretKeyMapping.secretKey }}
          {{- if or .Values.navidrome.existingSecret .Values.navidrome.password }}
            - name: NAVIDROME_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.navidromeSecretName" . }}
                  key: {{ .Values.navidrome.existingSecretKeyMapping.password }}
          {{- end }}
          {{- with .Values.global.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: temp-data
              mountPath: /data/zimmer/importer
            - name: tmp
              mountPath: /tmp
            - name: cookies
              mountPath: {{ .Values.cookies.workerMountPath | quote }}
              readOnly: true
          {{- if and .Values.caCert.enabled .Values.caCert.existingConfigMap }}
            - name: ca-cert
              mountPath: {{ .Values.caCert.path | quote }}
              subPath: {{ .Values.caCert.key }}
              readOnly: true
          {{- end }}
          {{- with .Values.worker.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - kill -0 1
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        - name: temp-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if .Values.cookies.hostPath }}
        - name: cookies
          hostPath:
            path: {{ .Values.cookies.hostPath | quote }}
            type: DirectoryOrCreate
        {{- else if .Values.cookies.persistence.enabled }}
        - name: cookies
          persistentVolumeClaim:
            claimName: {{ include "zimmporter.cookiesVolumeName" . }}
        {{- else }}
        - name: cookies
          emptyDir: {}
        {{- end }}
        {{- if and .Values.caCert.enabled .Values.caCert.existingConfigMap }}
        - name: ca-cert
          configMap:
            name: {{ .Values.caCert.existingConfigMap }}
            defaultMode: 0444
        {{- end }}
      {{- with .Values.worker.extraVolumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
