{{- if not .Values.mariadb.external.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "zimmporter.fullname" . }}-mariadb
  labels:
    {{- include "zimmporter.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
spec:
  serviceName: {{ include "zimmporter.fullname" . }}-mariadb
  replicas: 1
  selector:
    matchLabels:
      {{- include "zimmporter.mariadbSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zimmporter.mariadbSelectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: mariadb
          image: "{{ .Values.mariadb.image }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKeyMapping.rootPassword }}
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKeyMapping.name }}
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKeyMapping.user }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "zimmporter.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKeyMapping.password }}
          livenessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/mysqld
          resources:
            {{- toYaml .Values.mariadb.resources | nindent 12 }}
      {{- with .Values.mariadb.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mariadb.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mariadb.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.mariadb.storageClass }}
        storageClassName: {{ .Values.mariadb.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mariadb.persistence.size }}
{{- end }}
