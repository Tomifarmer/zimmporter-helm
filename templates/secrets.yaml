{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zimmporter.fullname" . }}-database
  labels:
    {{- include "zimmporter.labels" . | nindent 4 }}
type: Opaque
data:
  root-password: {{ .Values.database.rootPassword | b64enc | quote }}
  user: {{ .Values.database.user | b64enc | quote }}
  password: {{ .Values.database.password | b64enc | quote }}
  name: {{ .Values.database.name | b64enc | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zimmporter.fullname" . }}-minio
  labels:
    {{- include "zimmporter.labels" . | nindent 4 }}
type: Opaque
data:
  access-key: {{ .Values.minio.accessKey | b64enc | quote }}
  secret-key: {{ .Values.minio.secretKey | b64enc | quote }}
  bucket: {{ .Values.minio.bucket | b64enc | quote }}
---
{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zimmporter.fullname" . }}-api-auth
  labels:
    {{- include "zimmporter.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ .Values.auth.apiKey | b64enc | quote }}
{{- end }}
