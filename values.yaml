# ── Global ──────────────────────────────────────────────────────────
nameOverride: ""
fullnameOverride: ""
global:
  imagePullPolicy: ""

# ── Image settings ──────────────────────────────────────────────────
images:
  api:
    repository: ghcr.io/tomifarmer/zimmporter-api
    tag: "latest"
    pullPolicy: IfNotPresent
  worker:
    repository: ghcr.io/tomifarmer/zimmporter-worker
    tag: "latest"
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/tomifarmer/zimmporter-front
    tag: "latest"
    pullPolicy: IfNotPresent

# ── Ingress ─────────────────────────────────────────────────────────
ingress:
  api:
    enabled: false
    host: api.example.com
    className: ""
    annotations: {}
    tls: []
      # - hosts:
      #     - api.example.com
      #   secretName: api-tls
  frontend:
    enabled: false
    host: app.example.com
    className: ""
    annotations: {}
    tls: []
      # - hosts:
      #     - app.example.com
      #   secretName: frontend-tls

# ── API (FastAPI) ───────────────────────────────────────────────────
api:
  replicas: 1
  resources: {}
    # limits:
    #   cpu: 500m
    #   memory: 512Mi
    # requests:
    #   cpu: 250m
    #   memory: 256Mi
  podSecurityContext:
    fsGroup: 51000
  nodeSelector: {}
  tolerations: []
  affinity: {}
  initImage: busybox:1.36
  initSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
    readOnlyRootFilesystem: true
  probes:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 5
    readiness:
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
  env:
    USE_SIMPLE_AUTH: "false"
    USE_SOCIAL_LOGIN: "false"
    CORS_ALLOWED_ORIGINS: "*"
    OIDC_ISSUER_URL: ""
    OIDC_CLIENT_ID: ""
    GITHUB_CLIENT_ID: ""

# ── Celery Worker ───────────────────────────────────────────────────
worker:
  replicas: 1
  resources: {}
  podSecurityContext:
    fsGroup: 51000
  nodeSelector: {}
  tolerations: []
  affinity: {}
  initImage: busybox:1.36
  initSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
    readOnlyRootFilesystem: true
  concurrency: 4
  pool: prefork
  env: {}

# ── Frontend (Next.js) ──────────────────────────────────────────────
frontend:
  replicas: 1
  resources: {}
  podSecurityContext:
    runAsNonRoot: true
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env:
    API_URL: ""
    USE_SOCIAL_LOGIN: "false"
    USE_SIMPLE_AUTH: "false"
    OIDC_NAME: "OIDC"
    OIDC_ISSUER_URL: ""
    OIDC_CLIENT_ID: ""
    GITHUB_CLIENT_ID: ""

# ── External S3-compatible storage ──────────────────────────────────
s3:
  endpoint: ""
  accessKey: ""
  secretKey: ""
  bucket: ""
  useSSL: false

# ── MariaDB ─────────────────────────────────────────────────────────
mariadb:
  image: mariadb:11
  external:
    enabled: false
    host: ""
    port: 3306
  storageClass: ""
  persistence:
    size: 10Gi
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── Valkey ──────────────────────────────────────────────────────────
valkey:
  image: valkey/valkey:latest
  external:
    enabled: false
    address: ""
    port: 6379
  storageClass: ""
  persistence:
    size: 1Gi
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── Celery broker/backend (overrides auto-derived defaults) ─────────
celery:
  broker: ""
  backend: ""

# ── Database credentials ────────────────────────────────────────────
database:
  host: ""
  port: ""
  rootPassword: ""
  user: zimmporter
  password: ""
  name: zimmporter
  # Reference an existing Secret instead of generating one.
  # The secret must contain keys matching existingSecretKeyMapping below.
  existingSecret: ""
  existingSecretKeyMapping:
    rootPassword: root-password
    user: user
    password: password
    name: name

# ── Authentication ──────────────────────────────────────────────────
auth:
  apiKey: ""
  oidcClientSecret: ""
  githubClientSecret: ""
  authSecret: "dev-secret-change-in-production"
  # Reference an existing Secret instead of generating one.
  existingSecret: ""
  existingSecretKey: api-key

# ── Private CA certificate ──────────────────────────────────────────
caCert:
  enabled: false
  path: /etc/ssl/certs/ca.crt
  existingSecret: ""
  key: ca.crt
